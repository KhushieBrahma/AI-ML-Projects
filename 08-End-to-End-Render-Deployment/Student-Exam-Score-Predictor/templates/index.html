<!DOCTYPE html>
<html>
<head>
    <title>Student Exam Score Predictor</title>
    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
            text-align:center;
            margin-top:40px;
        }

        .container{
            width:420px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input,select{
            width:90%;
            padding:10px;
            margin:8px;
        }

        button{
            padding:12px 20px;
            background:#007BFF;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        h2{
            color:#333;
        }

        h3{
            color:green;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Student Exam Score Predictor</h2>

<form action="/predict" method="post">

<input type="number" step="any" name="Hours_Studied" placeholder="Hours Studied" required>

<input type="number" step="any" name="Attendance" placeholder="Attendance (%)" required>

<select name="Parental_Involvement">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>

<select name="Access_to_Resources">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>

<select name="Extracurricular_Activities">
<option>Yes</option>
<option>No</option>
</select>

<input type="number" step="any" name="Sleep_Hours" placeholder="Sleep Hours" required>

<input type="number" step="any" name="Previous_Scores" placeholder="Previous Score" required>

<br><br>

<button type="submit">
Predict
</button>

</form>

<br>

<h3>{{ prediction_text }}</h3>

</div>

</body>
</html>
